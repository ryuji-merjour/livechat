<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube ライブチャット ビューア</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1f1f1d; --sub: #6b6a65;
    --line: #e1dfd8; --accent: #c2410c; --accent-text: #ffffff;
    --owner: #b45309; --mod: #1d4ed8; --member: #15803d;
    --super-bg: #fff4d6; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --sub: #9b9a93;
      --line: #34332e; --accent: #f97316; --accent-text: #1a1008;
      --owner: #fbbf24; --mod: #60a5fa; --member: #4ade80;
      --super-bg: #3a2f10; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
    font-size: 14px; display: flex; flex-direction: column;
  }
  details.setup { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; }
  details.setup summary { cursor: pointer; font-weight: 600; user-select: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 12px 0 8px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 3px; }
  input[type=text], select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--sub); padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .status .err { color: var(--err); font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 14px; }
  .msg { display: flex; gap: 8px; padding: 5px 0; line-height: 1.5; }
  .msg img { width: 24px; height: 24px; border-radius: 50%; flex: none; margin-top: 2px; background: var(--line); }
  .msg .name { font-weight: 600; color: var(--sub); margin-right: 6px; }
  .msg .name.owner { color: var(--owner); }
  .msg .name.mod { color: var(--mod); }
  .msg .name.member { color: var(--member); }
  .msg .body { word-break: break-word; }
  .msg.super { background: var(--super-bg); border-radius: 6px; padding: 6px 8px; margin: 3px 0; }
  .msg.system { color: var(--sub); font-size: 12px; }
  .amount { font-weight: 700; color: var(--owner); margin-right: 6px; }
  .empty { color: var(--sub); text-align: center; margin-top: 40px; }
  .composer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px; }
  .composer .line { display: flex; gap: 8px; }
  .composer input { flex: 1; }
  .count { font-size: 11px; color: var(--sub); margin-top: 4px; text-align: right; }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; }
</style>
</head>
<body>

<details class="setup" id="setup" open>
  <summary>接続設定</summary>
  <div class="grid">
    <div>
      <label for="clientId">OAuth クライアントID（Google Cloudで発行）</label>
      <input type="text" id="clientId" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    </div>
    <div>
      <label for="videoUrl">ライブ配信のURL または 動画ID</label>
      <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    </div>
    <div>
      <label for="interval">コメント取得の最短間隔</label>
      <select id="interval">
        <option value="5">5秒（クォータ消費：大）</option>
        <option value="10" selected>10秒（おすすめ）</option>
        <option value="15">15秒</option>
        <option value="30">30秒（クォータ消費：小）</option>
      </select>
    </div>
    <div>
      <label for="fontSize">文字サイズ</label>
      <select id="fontSize">
        <option value="13">小</option>
        <option value="14" selected>中</option>
        <option value="17">大</option>
        <option value="21">特大</option>
      </select>
    </div>
  </div>
  <div class="row">
    <button class="primary" id="btnConnect">Googleでログインして接続</button>
    <button id="btnStop" disabled>停止</button>
    <label style="margin:0;display:flex;align-items:center;gap:5px;color:var(--text)">
      <input type="checkbox" id="autoScroll" checked> 自動スクロール
    </label>
  </div>
  <p class="hint">投稿は、ログインしたGoogleアカウント（チャンネル）の名前で行われます。</p>
</details>

<div class="status">
  <span id="statusText">未接続</span>
  <span id="quotaText"></span>
</div>

<div id="chat"><div class="empty">接続するとここにコメントが表示されます</div></div>

<div class="composer">
  <div class="line">
    <input type="text" id="postText" placeholder="コメントを入力（Enterで送信）" maxlength="200" disabled autocomplete="off">
    <button class="primary" id="btnPost" disabled>送信</button>
  </div>
  <div class="count"><span id="charCount">0</span> / 200</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  'use strict';

  var SCOPE = 'https://www.googleapis.com/auth/youtube.force-ssl';
  var MAX_DOM_MESSAGES = 500;

  var state = {
    token: null, expiry: 0,
    liveChatId: null, pageToken: null,
    running: false, timer: null,
    quota: 0, seen: {}
  };
  var tokenClient = null;
  var pending = null;

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    clientId: $('clientId'), videoUrl: $('videoUrl'), interval: $('interval'),
    fontSize: $('fontSize'), autoScroll: $('autoScroll'),
    btnConnect: $('btnConnect'), btnStop: $('btnStop'),
    status: $('statusText'), quota: $('quotaText'),
    chat: $('chat'), postText: $('postText'), btnPost: $('btnPost'),
    charCount: $('charCount'), setup: $('setup')
  };

  function AuthError() { this.name = 'AuthError'; this.message = 'ログインが必要です'; }
  AuthError.prototype = Object.create(Error.prototype);

  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  el.clientId.value = load('ylc_clientId');
  el.videoUrl.value = load('ylc_videoUrl');
  var savedInterval = load('ylc_interval'); if (savedInterval) el.interval.value = savedInterval;
  var savedFont = load('ylc_font'); if (savedFont) el.fontSize.value = savedFont;
  applyFont();

  function applyFont() { el.chat.style.fontSize = el.fontSize.value + 'px'; }
  el.fontSize.addEventListener('change', function () { applyFont(); save('ylc_font', el.fontSize.value); });
  el.interval.addEventListener('change', function () { save('ylc_interval', el.interval.value); });

  function setStatus(text, isErr) {
    el.status.textContent = text;
    el.status.className = isErr ? 'err' : '';
  }
  function updateQuota() {
    el.quota.textContent = '今回の推定クォータ消費: ' + state.quota + ' / 10,000（1日の標準上限）';
  }

  function parseVideoId(input) {
    input = (input || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
    var m = input.match(/[?&]v=([A-Za-z0-9_-]{11})/) ||
            input.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) ||
            input.match(/\/(?:live|embed|shorts|video)\/([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  /* ---------- 認証 ---------- */
  function initTokenClient(clientId) {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      throw new Error('Googleのログイン部品を読み込めませんでした。ネット接続を確認して再読み込みしてください。');
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: SCOPE,
      callback: function (r) { if (pending) pending.ok(r); },
      error_callback: function (e) { if (pending) pending.ng(e); }
    });
  }

  function requestToken() {
    return new Promise(function (resolve, reject) {
      pending = {
        ok: function (r) {
          if (r.error) { reject(new Error(r.error_description || r.error)); return; }
          state.token = r.access_token;
          state.expiry = Date.now() + (Number(r.expires_in) - 60) * 1000;
          resolve();
        },
        ng: function (e) {
          reject(new Error(e && e.type === 'popup_closed' ? 'ログインがキャンセルされました' :
                           'ログインに失敗しました（ポップアップがブロックされていないか確認してください）'));
        }
      };
      tokenClient.requestAccessToken({ prompt: '' });
    });
  }

  /* ---------- API ---------- */
  async function api(endpoint, params, method, body) {
    if (!state.token || Date.now() > state.expiry) throw new AuthError();
    var url = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
    Object.keys(params || {}).forEach(function (k) { url.searchParams.set(k, params[k]); });
    var headers = { Authorization: 'Bearer ' + state.token };
    if (body) headers['Content-Type'] = 'application/json';
    var res = await fetch(url.toString(), {
      method: method || 'GET', headers: headers,
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) throw new AuthError();
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      err.reason = data.error && data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
      throw err;
    }
    return data;
  }

  function explain(e) {
    switch (e.reason) {
      case 'liveChatEnded': return 'ライブチャットは終了しました。';
      case 'liveChatDisabled': return 'この配信ではチャットが無効になっています。';
      case 'quotaExceeded': return 'YouTube APIの1日の利用上限に達しました。太平洋時間の午前0時（日本時間 午後4時〜5時頃）にリセットされます。';
      case 'rateLimitExceeded': return 'リクエストが多すぎます。しばらく待って再試行します。';
      case 'forbidden': return '権限エラーです。テストユーザーの登録や、配信のチャット設定を確認してください。';
      default: return e.message || '不明なエラー';
    }
  }

  /* ---------- 接続 ---------- */
  el.btnConnect.addEventListener('click', async function () {
    var clientId = el.clientId.value.trim();
    var videoId = parseVideoId(el.videoUrl.value);
    if (!clientId) { setStatus('OAuthクライアントIDを入力してください', true); return; }
    if (!videoId) { setStatus('配信のURLか動画ID（11文字）を正しく入力してください', true); return; }
    save('ylc_clientId', clientId);
    save('ylc_videoUrl', el.videoUrl.value.trim());

    stopPolling();
    el.btnConnect.disabled = true;
    try {
      setStatus('Googleでログイン中…');
      initTokenClient(clientId);
      await requestToken();

      setStatus('配信情報を取得中…');
      var v = await api('videos', { part: 'liveStreamingDetails,snippet', id: videoId });
      state.quota += 1; updateQuota();
      if (!v.items || !v.items.length) throw new Error('動画が見つかりません。URLを確認してください。');
      var details = v.items[0].liveStreamingDetails || {};
      if (!details.activeLiveChatId) {
        throw new Error('ライブチャットが見つかりません。配信が開始済みか、チャットが有効か確認してください。');
      }
      state.liveChatId = details.activeLiveChatId;
      state.pageToken = null;
      state.seen = {};
      el.chat.innerHTML = '';
      addSystem('「' + (v.items[0].snippet.title || '') + '」に接続しました');

      state.running = true;
      el.btnStop.disabled = false;
      el.postText.disabled = false;
      el.btnPost.disabled = false;
      el.setup.open = false;
      setStatus('接続中（コメント取得中）');
      poll();
    } catch (e) {
      setStatus(e instanceof AuthError ? 'ログインできませんでした' : explain(e), true);
    } finally {
      el.btnConnect.disabled = false;
    }
  });

  el.btnStop.addEventListener('click', function () {
    stopPolling();
    setStatus('停止しました');
  });

  function stopPolling() {
    state.running = false;
    clearTimeout(state.timer);
    el.btnStop.disabled = true;
    el.postText.disabled = true;
    el.btnPost.disabled = true;
  }

  /* ---------- 取得ループ ---------- */
  async function poll() {
    if (!state.running) return;
    var wait = Number(el.interval.value) * 1000;
    try {
      var params = { liveChatId: state.liveChatId, part: 'snippet,authorDetails', maxResults: 200 };
      if (state.pageToken) params.pageToken = state.pageToken;
      var d = await api('liveChat/messages', params);
      state.quota += 5; updateQuota();
      state.pageToken = d.nextPageToken || state.pageToken;
      renderItems(d.items || []);
      wait = Math.max(wait, d.pollingIntervalMillis || 0);
      setStatus('接続中（' + new Date().toLocaleTimeString('ja-JP') + ' 更新）');
    } catch (e) {
      if (e instanceof AuthError) {
        stopPolling();
        setStatus('ログインの有効期限が切れました。「Googleでログインして接続」を押すと再開できます。', true);
        el.setup.open = true;
        return;
      }
      if (e.reason === 'liveChatEnded' || e.reason === 'liveChatDisabled' || e.reason === 'quotaExceeded' || e.reason === 'forbidden') {
        stopPolling();
        setStatus(explain(e), true);
        return;
      }
      setStatus('一時的なエラー: ' + explain(e) + '（再試行します）', true);
      wait = Math.max(wait, 30000);
    }
    if (state.running) state.timer = setTimeout(poll, wait);
  }

  /* ---------- 表示 ---------- */
  function addSystem(text) {
    var div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    el.chat.appendChild(div);
    scrollDown();
  }

  function scrollDown() {
    if (el.autoScroll.checked) el.chat.scrollTop = el.chat.scrollHeight;
  }

  function renderItems(items) {
    var added = false;
    items.forEach(function (it) {
      if (state.seen[it.id]) return;
      state.seen[it.id] = 1;
      var s = it.snippet || {};
      var a = it.authorDetails || {};
      var text = '', amount = '', isSuper = false;

      switch (s.type) {
        case 'textMessageEvent':
          text = (s.textMessageDetails && s.textMessageDetails.messageText) || s.displayMessage || '';
          break;
        case 'superChatEvent':
          isSuper = true;
          amount = (s.superChatDetails && s.superChatDetails.amountDisplayString) || '';
          text = (s.superChatDetails && s.superChatDetails.userComment) || '';
          break;
        case 'superStickerEvent':
          isSuper = true;
          amount = (s.superStickerDetails && s.superStickerDetails.amountDisplayString) || '';
          text = '（スーパースティッカー）';
          break;
        case 'newSponsorEvent':
          isSuper = true; text = 'メンバーになりました！'; break;
        case 'memberMilestoneChatEvent':
          isSuper = true;
          text = (s.memberMilestoneChatDetails && s.memberMilestoneChatDetails.userComment) || 'メンバー継続のお知らせ';
          break;
        case 'chatEndedEvent':
          addSystem('配信チャットが終了しました'); return;
        default:
          return;
      }

      var row = document.createElement('div');
      row.className = 'msg' + (isSuper ? ' super' : '');

      var img = document.createElement('img');
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      if (a.profileImageUrl) img.src = a.profileImageUrl;
      row.appendChild(img);

      var wrap = document.createElement('div');
      var name = document.createElement('span');
      name.className = 'name' + (a.isChatOwner ? ' owner' : a.isChatModerator ? ' mod' : a.isChatSponsor ? ' member' : '');
      name.textContent = (a.displayName || '') + (a.isChatOwner ? '（配信者）' : a.isChatModerator ? '（モデレーター）' : '');
      wrap.appendChild(name);

      if (amount) {
        var am = document.createElement('span');
        am.className = 'amount';
        am.textContent = amount;
        wrap.appendChild(am);
      }
      var body = document.createElement('span');
      body.className = 'body';
      body.textContent = text;
      wrap.appendChild(body);

      row.appendChild(wrap);
      el.chat.appendChild(row);
      added = true;
    });

    while (el.chat.children.length > MAX_DOM_MESSAGES) el.chat.removeChild(el.chat.firstChild);
    if (added) scrollDown();
  }

  /* ---------- 投稿 ---------- */
  el.postText.addEventListener('input', function () {
    el.charCount.textContent = el.postText.value.length;
  });
  el.postText.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendPost();
    }
  });
  el.btnPost.addEventListener('click', sendPost);

  async function sendPost() {
    var text = el.postText.value.trim();
    if (!text || !state.liveChatId) return;
    el.btnPost.disabled = true;
    try {
      await api('liveChat/messages', { part: 'snippet' }, 'POST', {
        snippet: {
          liveChatId: state.liveChatId,
          type: 'textMessageEvent',
          textMessageDetails: { messageText: text }
        }
      });
      state.quota += 20; updateQuota();
      el.postText.value = '';
      el.charCount.textContent = '0';
    } catch (e) {
      if (e instanceof AuthError) {
        setStatus('ログインの有効期限が切れました。再ログインしてください。', true);
        el.setup.open = true;
      } else {
        setStatus('投稿できませんでした: ' + explain(e), true);
      }
    } finally {
      if (state.running) el.btnPost.disabled = false;
      el.postText.focus();
    }
  }
})();
</script>
</body>
</html>
